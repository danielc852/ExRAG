[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "enterprise-rag-baseline"
version = "0.1.0"
description = "A reproducible LangChain and Deep Agents baseline for EnterpriseRAG-Bench"
requires-python = ">=3.11,<3.15"
dependencies = [
  "datasets>=3.0",
  "deepagents>=0.7,<0.8",
  "faiss-cpu>=1.8",
  "langchain>=1.3,<1.4",
  "langchain-ollama>=1.1,<1.2",
  "langchain-text-splitters>=1.1,<1.2",
  "langsmith>=0.10,<0.11",
  "numpy>=1.26",
  "pyarrow>=18.0",
  "pydantic>=2.8",
  "sentence-transformers>=3.0",
  "transformers>=4.45",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[tool.hatch.build.targets.wheel]
include = ["agent.py", "main.py", "tools.py", "data/**/*.py", "eval/**/*.py"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
